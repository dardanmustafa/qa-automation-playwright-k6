# GitLab CI version of .github/workflows/ci.yml, with the same jobs.
# Runs on pushes to main, on merge requests, on pipeline schedules (Build › Pipeline schedules, e.g. "0 5 * * 1-5")
# and when started by hand (Build › Pipelines › Run pipeline).
#
# Optional CI/CD variables (Settings › CI/CD › Variables):
#   OSM_ACCESS_TOKEN (masked)  without it the API tests that need a signed-in user are skipped
#   SHOP_URL                   test a fixed shop instead of a fresh demo.prestashop.com instance

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  RUN_LOAD_TEST:
    value: "false"
    options: ["false", "true"]
    description: Also run the k6 load test (1000 users in 15 s against quickpizza.grafana.com)

stages: [test, report]

default:
  # Node, Chromium and WebKit, built for the same Playwright version as package-lock.json
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  interruptible: true

.npm-ci:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

ui-tests:
  extends: .npm-ci
  stage: test
  timeout: 30m
  script:
    - npm run test:ui
  artifacts:
    name: ui-test-results
    when: always
    expire_in: 14 days
    paths:
      - test-results/ui/allure-results
      - playwright-report/ui
    reports:
      junit: test-results/ui/junit.xml

api-tests:
  extends: .npm-ci
  stage: test
  timeout: 10m
  script:
    - npm run test:api
  artifacts:
    name: api-test-results
    when: always
    expire_in: 14 days
    paths:
      - test-results/api/allure-results
      - playwright-report/api
    reports:
      junit: test-results/api/junit.xml

allure-report:
  extends: .npm-ci
  stage: report
  timeout: 10m
  needs: [ui-tests, api-tests]
  when: always # also build the report when a test job failed
  script:
    - npm run report:build
  artifacts:
    name: allure-report
    expire_in: 30 days
    paths: [allure-report]

load-test:
  stage: test
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RUN_LOAD_TEST == "true"
  variables:
    K6_VERSION: v2.3.0
  before_script:
    - arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
    - curl -sSfL "https://github.com/grafana/k6/releases/download/$K6_VERSION/k6-$K6_VERSION-linux-$arch.tar.gz" | tar -xz -C /usr/local/bin --strip-components=1 "k6-$K6_VERSION-linux-$arch/k6"
  script:
    # The same npm scripts as locally, so only the load test writes the k6 dashboard (load/results/dashboard.html).
    # The response analysis also runs when a load-test threshold fails; the job fails if either one does.
    - status=0
    - npm run load:test || status=$?
    - npm run load:analyse || status=$?
    - exit $status
  artifacts:
    name: load-test-dashboard
    when: always
    expire_in: 30 days
    paths: [load/results/dashboard.html]
